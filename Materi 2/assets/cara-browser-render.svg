<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Tahapan browser merender halaman</title>
  <desc id="desc">HTML menjadi DOM, CSS menjadi CSSOM, keduanya membentuk render tree, kemudian browser menjalankan layout, paint, dan compositing. JavaScript dapat memperbarui DOM dan CSSOM.</desc>
  <defs>
    <style>
      .bg{fill:#0f172a}.card{fill:#1e293b;stroke:#64748b;stroke-width:2}.accent{fill:#172554;stroke:#60a5fa;stroke-width:2}.title{font:700 25px Arial,sans-serif;fill:#f8fafc}.label{font:700 18px Arial,sans-serif;fill:#f8fafc}.body{font:15px Arial,sans-serif;fill:#cbd5e1}.arrow{stroke:#60a5fa;stroke-width:4;fill:none;marker-end:url(#head)}.js{stroke:#fbbf24;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#yellowHead)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker>
    <marker id="yellowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  </defs>
  <rect class="bg" width="1200" height="470" rx="24"/>
  <text class="title" x="600" y="48" text-anchor="middle">Pipeline rendering browser</text>
  <rect class="card" x="45" y="100" width="165" height="105" rx="15"/>
  <text class="label" x="127" y="143" text-anchor="middle">HTML</text><text class="body" x="127" y="173" text-anchor="middle">parse menjadi DOM</text>
  <rect class="card" x="45" y="265" width="165" height="105" rx="15"/>
  <text class="label" x="127" y="308" text-anchor="middle">CSS</text><text class="body" x="127" y="338" text-anchor="middle">parse menjadi CSSOM</text>
  <rect class="accent" x="285" y="182" width="175" height="105" rx="15"/>
  <text class="label" x="372" y="225" text-anchor="middle">Render tree</text><text class="body" x="372" y="255" text-anchor="middle">node yang terlihat</text>
  <rect class="card" x="535" y="182" width="150" height="105" rx="15"/>
  <text class="label" x="610" y="225" text-anchor="middle">Layout</text><text class="body" x="610" y="255" text-anchor="middle">ukuran &amp; posisi</text>
  <rect class="card" x="760" y="182" width="150" height="105" rx="15"/>
  <text class="label" x="835" y="225" text-anchor="middle">Paint</text><text class="body" x="835" y="255" text-anchor="middle">gambar piksel</text>
  <rect class="accent" x="985" y="182" width="170" height="105" rx="15"/>
  <text class="label" x="1070" y="225" text-anchor="middle">Composite</text><text class="body" x="1070" y="255" text-anchor="middle">gabungkan layer</text>
  <path class="arrow" d="M210 150 C250 150 245 210 275 220"/><path class="arrow" d="M210 318 C250 318 245 260 275 250"/>
  <path class="arrow" d="M460 235 H525"/><path class="arrow" d="M685 235 H750"/><path class="arrow" d="M910 235 H975"/>
  <rect x="392" y="365" width="416" height="65" rx="14" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text class="label" x="600" y="392" text-anchor="middle">JavaScript</text><text class="body" x="600" y="416" text-anchor="middle">dapat mengubah DOM atau style lalu memicu pembaruan</text>
  <path class="js" d="M480 365 C390 335 300 330 245 305"/>
</svg>
